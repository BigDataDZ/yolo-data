name: nightly

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python analysis dependencies
        run: python -m pip install --upgrade pip pandas openpyxl
      - name: Install dependencies
        run: npm ci
      - name: Coverage
        run: node --test --experimental-test-coverage
      - name: L1/L2/L3 eval
        run: npm run eval
